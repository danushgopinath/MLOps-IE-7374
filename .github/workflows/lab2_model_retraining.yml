name: Lab2 Model Retraining
run-name: Lab2 retraining (${{ github.event_name }})

on:
  push:
    branches:
      - main
    paths:
      - "Lab2/src/**"
      - "Lab2/test/**"
      - "Lab2/requirements.txt"
      - ".github/workflows/lab2_model_retraining.yml"
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Number of trees in the random forest"
        required: true
        default: "100"
      max_depth:
        description: "Maximum tree depth (0 = no limit)"
        required: true
        default: "0"
      min_f1:
        description: "Minimum test F1 a new model needs to be versioned"
        required: true
        default: "0.85"

# Needed so the workflow can push the new model and tag back to the repo
permissions:
  contents: write

# Only one retraining run at a time, so two runs never push to main at the same moment
concurrency:
  group: lab2-model-retraining
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # On push there are no inputs, so the defaults after || are used
  N_ESTIMATORS: ${{ inputs.n_estimators || '100' }}
  MAX_DEPTH: ${{ inputs.max_depth || '0' }}
  MIN_F1: ${{ inputs.min_f1 || '0.85' }}
  MAX_DROP: "0.01"

defaults:
  run:
    working-directory: Lab2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Lab2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  train:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Lab2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create version from timestamp
        id: version
        run: echo "version=$(date -u '+%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Train model
        run: >
          python -m src.train_model
          --version "${{ steps.version.outputs.version }}"
          --n-estimators "$N_ESTIMATORS"
          --max-depth "$MAX_DEPTH"
          --out-dir .

      # Fails the job (and skips publish) if the new model is not good enough
      - name: Evaluate model and apply quality gate
        run: >
          python -m src.evaluate_model
          --version "${{ steps.version.outputs.version }}"
          --min-f1 "$MIN_F1"
          --max-drop "$MAX_DROP"
          --out-dir .

      # Runs even if the gate failed, so a rejected model can still be downloaded and inspected
      - name: Upload model and metrics
        if: always() && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: lab2-model-${{ steps.version.outputs.version }}
          path: |
            Lab2/models/model_${{ steps.version.outputs.version }}_rf.joblib
            Lab2/models/latest.json
            Lab2/metrics/${{ steps.version.outputs.version }}_metrics.json
          retention-days: 14

  publish:
    needs: train
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.train.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download model and metrics
        uses: actions/download-artifact@v8
        with:
          name: lab2-model-${{ env.VERSION }}
          path: Lab2

      - name: Commit, tag and push the new model version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models metrics
          git commit -m "Lab2: add model version ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
          git tag "lab2-model-${VERSION}"
          git push origin "lab2-model-${VERSION}"

      - name: Add result to job summary
        run: |
          echo "### Published model version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`lab2-model-${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`Lab2/models/model_${VERSION}_rf.joblib\`" >> "$GITHUB_STEP_SUMMARY"
